name = "lc-hot100"
pages_build_output_dir = "out"
compatibility_date = "2026-10-01"

# 网站的数据就是这个仓库：Pages Functions 在运行时通过 GitHub API 读取。
# 私有仓库需要令牌：wrangler pages secret put GITHUB_TOKEN --project-name lc-hot100
# 令牌只存在 Cloudflare 的加密环境变量里，不要写进这个文件或仓库里的任何地方。
# 登录用的 GitHub App：GITHUB_APP_CLIENT_ID、GITHUB_APP_CLIENT_SECRET，会话加密密钥 SESSION_SECRET，
# 都用 wrangler pages secret put 设置。它们和下面的 GITHUB_APP_SLUG 都设好之前，网站照常能看，只是没有登录入口。
[vars]
GITHUB_REPO = "Hanwen-Jiang/leetcode"
GITHUB_BRANCH = "main"
# 0 进度的进度仓模板，用户用它在自己账号下建名为 PROGRESS_REPO 的进度仓
TEMPLATE_REPO = "Hanwen-Jiang/hot100-progress-template"
PROGRESS_REPO = "hot100-progress"
# GitHub App 的 slug（https://github.com/apps/<slug>），建好 App 后填上
GITHUB_APP_SLUG = ""

name = "lc-hot100"
pages_build_output_dir = "out"
compatibility_date = "2026-10-01"

# 网站的数据就是这个仓库：Pages Functions 在运行时通过 GitHub API 读取。
# 私有仓库需要令牌：wrangler pages secret put GITHUB_TOKEN --project-name lc-hot100
# 令牌只存在 Cloudflare 的加密环境变量里，不要写进这个文件或仓库里的任何地方。
# 登录用的 GitHub App：GITHUB_APP_CLIENT_ID、GITHUB_APP_CLIENT_SECRET，会话加密密钥 SESSION_SECRET，
# 都用 wrangler pages secret put 设置。它们和下面的 GITHUB_APP_SLUG 都设好之前，网站照常能看，只是没有登录入口。
[vars]
GITHUB_REPO = "Hanwen-Jiang/leetcode"
GITHUB_BRANCH = "main"
# 0 进度的进度仓模板，用户用它在自己账号下建名为 PROGRESS_REPO 的进度仓
TEMPLATE_REPO = "Hanwen-Jiang/hot100-progress-template"
PROGRESS_REPO = "hot100-progress"
# 页面上请用户点 Star 的仓库（逗号分隔）。界面上会逐个列出来，默认勾着，用户可以取消
STAR_REPOS = "Hanwen-Jiang/agent-runtime,Hanwen-Jiang/coding-agent,Hanwen-Jiang/leetcode,Timmononon/StoreAgent,Timmononon/my-runtime"
# 首批用户（代码里叫 founder）：在这之前授权网站或建好进度仓的用户，永久享有最高档（北京时间 2026-11-18 0 点）
FOUNDER_CUTOFF = "2026-11-18T00:00:00+08:00"
# GitHub App 的 slug（https://github.com/apps/<slug>），建好 App 后填上
GITHUB_APP_SLUG = "coding-dance"
# 网站的几个域名（都是这个 Pages 项目的自定义域名）。Phase 2 起，认证、进度、设置、题解与同步路由由 Edge BFF 代理至统一 Go 后端 cd-api：
# 通过加密或公开变量设置 CD_API_UPSTREAM（如 "https://api.codingdance.cn"）；若开启了 Access 保护再配置 CD_API_ACCESS_ID / CD_API_ACCESS_SECRET。
# 测试见 functions/_lib/test/bff.test.ts。
# CD_API_UPSTREAM = "https://api.codingdance.cn"
SITE_ORIGINS = "https://leetcode.cgent.link,https://codexdance.cn,https://codingdance.cn"
# 云端运行（Java / C++ / Go）的运行器集群：「节点编号=地址」用逗号隔开，见 tools/runner/README.md 和 functions/_lib/runner.ts。
# 各节点共用的签名密钥 RUNNER_SECRET 是加密环境变量；运行器前面开了 Cloudflare Access 的话，服务令牌 RUNNER_ACCESS_ID / RUNNER_ACCESS_SECRET 也是。
# 加节点就往这里加一条（新节点用同一个 RUNNER_SECRET）；没设时练习区的 Java / C++ / Go 会提示「云端运行还没有部署」。
RUNNER_NODES = "lou1=https://run-lou1.codingdance.cn"
# coding-agent 伴学网关公开地址；鉴权密钥 CODING_DANCE_API_TOKEN 只放在 Cloudflare Pages 加密环境变量里
CODING_AGENT_URL = "https://code.cgent.link"

# 同一次登录在几个域名上共用一套 GitHub 令牌；refresh token 只能用一次，换新后把新令牌（加密）存在这里给别的域名取
[[kv_namespaces]]
binding = "SESSIONS"
id = "d99da5d8e67e48be9621d39cd59859ac"

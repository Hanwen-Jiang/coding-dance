name: verify

# 每次 push：重新生成一遍数据（演示答案、Python 测试、步骤标记都要过），
# 再把六种语言的每段题解编译、运行，和 Python 标准解法的答案比对。
on:
  push:
    branches: [main, multilang, feat/go-modernization]
  pull_request:
  workflow_dispatch:

jobs:
  go-modernization:
    name: Go 控制面与零私有源构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Go 静态检查与竞态单测（cd-runner / cd-api / cd-build）
        run: |
          go vet ./...
          go test -race ./...
      - name: 编译纯静态三二进制并执行并发题库核对与 R2 打包
        run: |
          mkdir -p /tmp/cd-bin
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o /tmp/cd-bin/cd-runner ./cmd/cd-runner
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o /tmp/cd-bin/cd-api ./cmd/cd-api
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o /tmp/cd-bin/cd-build ./cmd/cd-build
          /tmp/cd-bin/cd-build verify --root .
          /tmp/cd-bin/cd-build bundle --root . --out /tmp/r2-staging
      - name: 零私有源 Token 静态前端构建验证（HeroUI Pro Shim + R2 Runtime Manifest）
        working-directory: site
        run: |
          npm install --no-audit --no-fund --ignore-scripts
          HEROUI_PRO_SHIM=1 NEXT_PUBLIC_RUNTIME_BASE_URL=https://assets.codingdance.cn/practice-runtime/vendor npm run build
          test -f out/index.html

  build:
    name: 生成器和网站测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 生成数据和图解页面
        run: node tools/illustrations/build.js --strict
      - name: 生成的文件要和提交的一致
        run: git diff --exit-code -- tools/illustrations/data tools/illustrations/cases illustrations
      - name: 同步逻辑、练习区写进度仓的测试
        working-directory: site
        run: |
          node lib/sync/test/sync.test.ts
          node lib/practice/test/record.test.ts
          node lib/practice/test/save-queue.test.ts
          node functions/_lib/test/runner.test.ts
      - name: 多域名登录的测试
        working-directory: site
        run: node functions/_lib/test/sso.test.ts

  practice:
    name: 练习数据和运行器
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 练习数据要和提交的一致
        run: |
          node tools/practice/build.cjs
          git diff --exit-code -- tools/practice/data
          # 新生成、还没提交的文件（比如新加了一题）git diff 看不到，用 status 再查一遍
          test -z "$(git status --porcelain -- tools/practice/data)" || { git status --short -- tools/practice/data; exit 1; }
      - name: 练习数据和输入输出的测试
        run: node tools/practice/test.cjs
      # 网站的其他依赖（HeroUI Pro）要授权，CI 里装不了，所以网站本身不在 CI 里构建；这里只单独装运行器测试用到的两个包
      - name: 装运行器测试要的包
        run: |
          mkdir -p /tmp/rt && cd /tmp/rt && npm init -y > /dev/null && npm install --no-audit --no-fund pyodide@314.0.8 typescript@5.6.3
          mkdir -p "$GITHUB_WORKSPACE/site/node_modules" && cp -r /tmp/rt/node_modules/. "$GITHUB_WORKSPACE/site/node_modules/"
      - name: 运行器的测试（Python、JavaScript、TypeScript）
        run: node tools/practice-runtime/test.mjs
      - name: 调试（执行记录）的测试
        run: node tools/practice-runtime/debug.test.mjs

  judge:
    name: 判题 ${{ matrix.lang }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lang: [python, java, cpp, go, javascript, typescript]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - if: matrix.lang == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - if: matrix.lang == 'java'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - if: matrix.lang == 'go'
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: false
      - if: matrix.lang == 'typescript'
        run: npm install -g typescript@5.6
      - name: 判题
        run: node tools/illustrations/judge/run.js --require --lang ${{ matrix.lang }}

  # 远端运行器（tools/runner）：构建沙箱镜像，在新容器里跑十五种语言的练习、调试和安全检查，
  # 九种只在云端的语言再把 100 道题的起始代码都编译一遍，最后经服务完整跑一遍
  runner:
    name: 远端运行器
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: 腾出磁盘空间（镜像里有十几种语言的工具链，好几 GB）
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/powershell /usr/local/share/chromium
          docker image prune -af > /dev/null
          df -h /
      - uses: docker/setup-buildx-action@v3
      - name: 构建沙箱镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: tools/runner/image/Dockerfile
          tags: lc-runner:ci
          load: true
          cache-from: type=gha,scope=lc-runner
          cache-to: type=gha,mode=max,scope=lc-runner
      - name: 沙箱（十五种语言、调试、容器限制）
        run: RUNNER_TEST_IMAGE=lc-runner:ci node tools/runner/test/sandbox.test.mjs
      - name: 起始代码和判题程序对得上（C、C#、Kotlin、Swift、Rust、Ruby、PHP、Scala、Dart × 100 题）
        run: docker run --rm -v "$PWD:/src:ro" -w /src -e RUNNER_WORK=/tmp/work lc-runner:ci node tools/runner/test/starters.test.mjs
      - name: 服务（签名、限流、容器池）
        run: RUNNER_TEST_IMAGE=lc-runner:ci node tools/runner/test/server.test.mjs
      - name: Firecracker 驱动的协议（假 fc-manager；真 microVM 见 firecracker.yml）
        run: node tools/runner/test/firecracker.test.mjs
